<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KIZASHI 発音プレビュー確認</title>
  <style>
    body{margin:0;background:#eef3f8;color:#12233d;font-family:"Yu Gothic UI","Noto Sans JP",sans-serif}
    main{max-width:820px;margin:40px auto;padding:36px;background:#fff;border-radius:24px;box-shadow:0 14px 40px #16304a1f}
    h1{font-size:34px;margin:0 0 10px}.lead{font-size:18px;line-height:1.8;color:#42566d}
    audio{width:100%;margin:18px 0 24px}.check{display:grid;gap:12px;margin:22px 0}
    .item{padding:16px 18px;border-left:7px solid #0b91a4;background:#f2fafb;border-radius:10px;font-size:20px}
    .reply{margin-top:28px;padding:20px;background:#102a43;color:#fff;border-radius:14px;font-size:20px;line-height:1.7}
    code{background:#fff2;color:#ffec9e;padding:2px 6px;border-radius:5px}
  </style>
</head>
<body><main>
  <h1>発音プレビュー確認</h1>
  <p class="lead">18.29秒です。再生して、次の4語と全体の日本語の抑揚を確認してください。</p>
  <audio controls preload="metadata" src="pronunciation-preview.aivis.mp3"></audio>
  <section class="check">
    <div class="item">Bocconi University → <strong>ボッコーニ大学</strong></div>
    <div class="item">ChatGPT → <strong>チャットジーピーティー</strong></div>
    <div class="item">OpenAI → <strong>オープンエーアイ</strong></div>
    <div class="item">AI → <strong>エーアイ</strong></div>
  </section>
  <p class="lead">「まず・続いて・最後は」「さんぼん」が自然で、助詞・語尾・疑問文の抑揚に違和感がないかも確認してください。</p>
  <div class="reply">問題なければ <code>発音プレビューOK</code> と返信してください。</div>
</main></body>
</html>
