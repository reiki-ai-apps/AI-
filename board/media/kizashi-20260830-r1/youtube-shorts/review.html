<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shorts visual review</title><style>body{background:#eaf0f6;color:#10233f;font-family:"Yu Gothic UI",sans-serif;margin:0}main{max-width:1160px;margin:auto;padding:28px}header,section{background:white;border-radius:22px;padding:24px;margin-bottom:22px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}img{width:100%;border-radius:14px}pre{white-space:pre-wrap;font:inherit;line-height:1.8}@media(max-width:700px){main{padding:12px}.grid{grid-template-columns:1fr}}</style></head><body><main><header><h1>日曜Shorts Revision 1</h1><p>実在写真＋要点スライド。字幕帯とスライド文字は490px分離。iPhone／Android相当UIの9フレームで重なり0px。</p></header><section><h2>9フレーム</h2><div class="grid"><img src="frames/scene-01.png" alt="scene 1"><img src="frames/scene-02.png" alt="scene 2"><img src="frames/scene-03.png" alt="scene 3"><img src="frames/scene-04.png" alt="scene 4"><img src="frames/scene-05.png" alt="scene 5"><img src="frames/scene-06.png" alt="scene 6"><img src="frames/scene-07.png" alt="scene 7"><img src="frames/scene-08.png" alt="scene 8"><img src="frames/scene-09.png" alt="scene 9"></div></section><section><h2>台本</h2><pre>使っているAIが止まる前に、代替ツール探しより先にやることは5つ。守る業務を一覧化。社内切替日は外部の終了日前に置く。同じ代表ケースで品質と費用を比較。設定・評価・ログを退避。失敗時に誰が止め、何へ戻すかを決める。OpenAIはCursorへのモデル提供終了の意向と11月12日の停止案を公表しました。期限は、次のAIを選ぶだけでなく、業務を止めない設計に使いましょう。</pre></section></main></body></html>
