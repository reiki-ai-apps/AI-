<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン｜見本産業 工事注文書</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: grid; place-items: center; font-family: "Yu Gothic UI", "Hiragino Sans", Meiryo, sans-serif; background: linear-gradient(160deg, #0b4f2e, #1b7a4a); color: #1c2822; padding: 16px; }
    .card { width: min(380px, 100%); background: #fff; border-radius: 16px; padding: 28px 26px 24px; box-shadow: 0 24px 60px rgba(0,0,0,.28); }
    .eyebrow { font-size: 11px; letter-spacing: .18em; color: #087a42; font-weight: 800; }
    h1 { font-size: 20px; margin: 4px 0 2px; }
    p.sub { font-size: 13px; color: #536158; margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 700; margin: 12px 0 5px; }
    input { width: 100%; min-height: 46px; padding: 0 12px; border: 1px solid #cad5cd; border-radius: 9px; font-size: 16px; }
    input:focus { outline: 0; border-color: #087a42; box-shadow: 0 0 0 3px rgba(8,122,66,.15); }
    button { width: 100%; min-height: 48px; margin-top: 18px; border: 0; border-radius: 9px; background: #087a42; color: #fff; font-size: 16px; font-weight: 800; cursor: pointer; }
    button:disabled { opacity: .6; }
    .error { margin-top: 12px; padding: 10px 12px; border-radius: 9px; background: #fdecec; color: #b42318; font-size: 13px; display: none; }
    .note { margin-top: 16px; font-size: 11px; color: #6b7a70; line-height: 1.6; }
  .brand-art,.empty-illustration{display:none!important}</style>
</head>
<body>
  <form class="card" id="form">
    <div class="eyebrow">SAMPLE</div>
    <h1>工事注文書ツール</h1>
    <p class="sub">IDとパスワードを入れてください</p>
    <label for="username">ID</label>
    <input id="username" name="username" autocomplete="username" autocapitalize="off" autofocus>
    <label for="password">パスワード</label>
    <input id="password" name="password" type="password" autocomplete="current-password">
    <button type="submit" id="submit">ログイン</button>
    <div class="error" id="error"></div>
    <p class="note">ログインの記録（日時・ID・接続元）は、個人情報を守るために保存されます。</p>
  </form>
  <script>window.__DEMO_META__ = {"fields": [{"key": "input_date", "label": "入力日", "type": "date", "required": true}, {"key": "staff", "label": "担当（入力者）", "type": "staff", "required": true}, {"key": "contractor", "label": "工事依頼先", "type": "contractor", "required": true}, {"key": "contractor_code", "label": "仕入先コード", "type": "text", "derived": true}, {"key": "customer_name", "label": "お客様名", "type": "text", "required": true}, {"key": "billing_to", "label": "請求先", "type": "text"}, {"key": "kubun_company", "label": "工事区分（請負元）", "type": "kubun"}, {"key": "kubun_cls", "label": "工事区分", "type": "text", "derived": true}, {"key": "site", "label": "工事場所（都道府県・市町村名）", "type": "text", "required": true}, {"key": "work_name", "label": "工事名", "type": "text", "required": true}, {"key": "work_type", "label": "工事種類", "type": "work_type"}, {"key": "work_type_cls", "label": "種別", "type": "text", "derived": true}, {"key": "industry", "label": "建設業種", "type": "industry"}, {"key": "industry_cls", "label": "業種種別", "type": "text", "derived": true}, {"key": "order_amount", "label": "受注金額（資材費含む総額・税抜）", "type": "money", "required": true}, {"key": "period_start", "label": "工期 開始", "type": "date"}, {"key": "period_end", "label": "工期 終了", "type": "date"}, {"key": "payment_amount", "label": "支払金額（税抜）", "type": "money"}, {"key": "sales_amount", "label": "売上金額（税抜）", "type": "money"}, {"key": "content_1", "label": "工事内容 1行目", "type": "line", "maxlen": 30}, {"key": "content_2", "label": "工事内容 2行目", "type": "line", "maxlen": 30}, {"key": "content_3", "label": "工事内容 3行目", "type": "line", "maxlen": 30}, {"key": "content_4", "label": "工事内容 4行目", "type": "line", "maxlen": 30}, {"key": "content_5", "label": "工事内容 5行目", "type": "line", "maxlen": 30}, {"key": "content_6", "label": "工事内容 6行目", "type": "line", "maxlen": 30}, {"key": "content_7", "label": "工事内容 7行目", "type": "line", "maxlen": 30}, {"key": "content_8", "label": "工事内容 8行目", "type": "line", "maxlen": 30}, {"key": "content_9", "label": "工事内容 9行目", "type": "line", "maxlen": 30}, {"key": "content_10", "label": "工事内容 10行目", "type": "line", "maxlen": 30}, {"key": "note_1", "label": "連絡事項 1行目", "type": "line", "maxlen": 40}, {"key": "note_2", "label": "連絡事項 2行目", "type": "line", "maxlen": 40}, {"key": "note_3", "label": "連絡事項 3行目", "type": "line", "maxlen": 40}, {"key": "note_4", "label": "連絡事項 4行目", "type": "line", "maxlen": 40}, {"key": "note_5", "label": "連絡事項 5行目", "type": "line", "maxlen": 40}, {"key": "note_6", "label": "連絡事項 6行目", "type": "line", "maxlen": 40}], "masters": {"contractors": [{"name": "見本ハウス 株式会社", "code": "0101", "contract_date": "2017-04-01"}, {"name": "サンプル工業", "code": "0102", "contract_date": "2019-08-01"}, {"name": "テスト設備 株式会社", "code": "0103", "contract_date": "2021-08-20"}, {"name": "当社施工", "code": "00022", "contract_date": ""}], "staff": [{"code": "001", "name": "営業 一郎", "short": "営業A"}, {"code": "002", "name": "営業 二郎", "short": "営業B"}, {"code": "003", "name": "営業 三郎", "short": "営業C"}], "work_types": [{"name": "ハウス新設", "cls": "新築"}, {"name": "他", "cls": "改修"}], "industries": [{"name": "新設・外張り張替", "cls": "とび土工"}, {"name": "解体", "cls": "解体"}, {"name": "カーテン張替・その他改修", "cls": "その他"}], "kubun": [{"code": "", "name": "元請", "cls": "元請"}, {"code": "900001", "name": "見本建設 株式会社", "cls": "下請"}, {"code": "900002", "name": "サンプル設備工業", "cls": "下請"}]}};</script>
<script src="demo-api.js"></script>
<script>
    const form = document.getElementById("form");
    const error = document.getElementById("error");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      error.style.display = "none";
      const button = document.getElementById("submit");
      button.disabled = true;
      try {
        const response = await fetch("api/login", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({username: form.username.value, password: form.password.value}),
        });
        const body = await response.json();
        if (!response.ok) throw new Error(body.error || "ログインできませんでした。");
        const params = new URLSearchParams(location.search);
        const next = params.get("next");
        location.href = (next && next.startsWith("/") && !next.startsWith("//")) ? next : (body.next || "/");
      } catch (err) {
        error.textContent = err.message;
        error.style.display = "block";
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
