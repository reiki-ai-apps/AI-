name: Update AI feeds

on:
  schedule:
    # 海外発表の見逃しを減らすため、3時間ごとに監視する
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "update-ai-feeds"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: get repo
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: test story deduplication
        run: node scripts/test-dedupe.mjs

      - name: test AI cache, protected slots, and reuse rules
        run: node scripts/test-ai-operations.mjs

      - name: test featured tool research coverage
        run: node scripts/test-tool-research-coverage.mjs

      - name: test global top news and AI industry leadership coverage
        run: node scripts/test-global-top-news.mjs

      - name: validate optional USD budget settings
        env:
          AI_DAILY_BUDGET_USD: ${{ vars.AI_DAILY_BUDGET_USD }}
          AI_INPUT_USD_PER_MTOK: ${{ vars.AI_INPUT_USD_PER_MTOK }}
          AI_OUTPUT_USD_PER_MTOK: ${{ vars.AI_OUTPUT_USD_PER_MTOK }}
          AI_CACHE_WRITE_USD_PER_MTOK: ${{ vars.AI_CACHE_WRITE_USD_PER_MTOK }}
          AI_CACHE_READ_USD_PER_MTOK: ${{ vars.AI_CACHE_READ_USD_PER_MTOK }}
        run: |
          node - <<'NODE'
          const budget = Number(process.env.AI_DAILY_BUDGET_USD || 0);
          if (budget < 0 || !Number.isFinite(budget)) throw new Error("AI_DAILY_BUDGET_USD must be a non-negative number");
          if (budget > 0) {
            for (const key of ["AI_INPUT_USD_PER_MTOK", "AI_OUTPUT_USD_PER_MTOK", "AI_CACHE_WRITE_USD_PER_MTOK", "AI_CACHE_READ_USD_PER_MTOK"]) {
              const value = Number(process.env[key]);
              if (!(value > 0)) throw new Error(`${key} must be a positive number when the USD budget is enabled`);
            }
          }
          console.log(budget > 0 ? `USD budget enabled: $${budget}/day` : "USD budget disabled; hard article caps remain enabled");
          NODE

      - name: build data.json
        run: node update.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-5
          AI_DAILY_BUDGET_USD: ${{ vars.AI_DAILY_BUDGET_USD }}
          AI_INPUT_USD_PER_MTOK: ${{ vars.AI_INPUT_USD_PER_MTOK }}
          AI_OUTPUT_USD_PER_MTOK: ${{ vars.AI_OUTPUT_USD_PER_MTOK }}
          AI_CACHE_WRITE_USD_PER_MTOK: ${{ vars.AI_CACHE_WRITE_USD_PER_MTOK }}
          AI_CACHE_READ_USD_PER_MTOK: ${{ vars.AI_CACHE_READ_USD_PER_MTOK }}

      - name: persist charged AI operations ledger
        if: always()
        run: |
          files=()
          [ -f .ai-cache.json ] && files+=(.ai-cache.json)
          [ -f .ai-usage.json ] && files+=(.ai-usage.json)
          [ -f .story-index.json ] && files+=(.story-index.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No AI ledger files to persist"
            exit 0
          fi
          git config user.name "ai-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- "${files[@]}"
          if git diff --staged --quiet; then
            echo "AI ledger is already current"
            exit 0
          fi
          git commit -m "record AI processing usage"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Ledger push failed (attempt ${attempt}); rebasing before retry"
            git pull --rebase --autostash origin main
          done
          echo "AI ledger could not be persisted"
          exit 1

      - name: validate published articles
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const items = JSON.parse(fs.readFileSync("data.json", "utf8"));
          const required = [
            "title", "raw_excerpt", "detail", "change_summary",
            "impact_summary", "action_suggestion", "importance",
            "source_url", "article_id", "story_id", "relation_type",
            "event_status", "event_date_precision", "fetched_at"
          ];
          const demoTitles = new Set([
            "Claude Code に新しいエージェント機能とサブエージェント並列実行が追加",
            "OpenAI が新モデルと API の価格改定を発表（pricing / new model）",
            "Suno に新しい音楽生成モデルとステム分離（music / voice）機能が登場",
            "v0 が画面デザインからフルスタックアプリ生成に対応（code / launch）",
            "Gemini に画像生成（image）と長文要約の新機能が追加",
            "Canva に AI 一括デザイン生成（Magic）機能が追加",
            "Runway が新しい動画生成モデル（video）をベータ公開",
            "Cursor のエディタUIと補完が小幅アップデート"
          ]);
          const normalize = value => String(value || "").normalize("NFKC")
            .toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "");
          const fatal = [];
          const invalidIndexes = new Set();
          const itemError = (index, message) => { invalidIndexes.add(index); return `${index + 1}件目: ${message}`; };
          const errors = [];
          if (!Array.isArray(items)) {
            console.error("data.json が配列ではありません");
            process.exit(1);
          }
          if (items.length > 60) {
            fatal.push(`公開上限60件を超えています: ${items.length}`);
          }
          items.forEach((item, index) => {
            for (const key of required) {
              if (typeof item[key] !== "string" || !item[key].trim()) {
                errors.push(itemError(index, `${key} が空です`));
              }
            }
            if (!Array.isArray(item.related_categories) || item.related_categories.length === 0) {
              errors.push(itemError(index, "related_categories が空です"));
            }
            if (!Array.isArray(item.story_entities) || item.story_entities.length === 0) {
              errors.push(itemError(index, "story_entities が空です"));
            }
            if (!item.source_published_at && !["unknown", "updated_only"].includes(item.source_date_status)) {
              errors.push(itemError(index, "情報元掲載日がないのに日付確認済みになっています"));
            }
            if (item.event_date_precision === "unknown" && item.event_at) {
              errors.push(itemError(index, "出来事の日付精度と値が矛盾しています"));
            }
            if (item.event_at && !/^20\d{2}-\d{2}-\d{2}$/.test(item.event_at)) {
              errors.push(itemError(index, "出来事の日がYYYY-MM-DDではありません"));
            }
            if (["follow_up", "correction"].includes(item.relation_type) &&
                (!item.previous_article_id || !item.continuation_lead || Number(item.relation_confidence) < 0.85)) {
              errors.push(itemError(index, "続報・訂正の前回情報または確信度が不足しています"));
            }
            if (["follow_up", "correction"].includes(item.relation_type) &&
                (!Number.isFinite(Number(item.story_sequence)) || Number(item.story_sequence) < 2)) {
              errors.push(itemError(index, "続報番号が不正です"));
            }
            if (!["S", "A", "B", "C"].includes(String(item.importance || "").toUpperCase())) {
              errors.push(itemError(index, "importance がS〜Cではありません"));
            }
            if (demoTitles.has(item.title)) {
              errors.push(itemError(index, "デモ記事が混入しています"));
            }
            const normalizedTitle = normalize(item.title);
            const normalizedSummary = normalize(item.raw_excerpt);
            if (normalizedTitle && normalizedSummary &&
                (normalizedTitle === normalizedSummary ||
                 (normalizedSummary.includes(normalizedTitle) && normalizedSummary.length < normalizedTitle.length + 35))) {
              errors.push(itemError(index, "要約がタイトルの繰り返しです"));
            }
            const explanation = [
              item.raw_excerpt, item.detail, item.change_summary,
              item.impact_summary, item.action_suggestion
            ].join("");
            if (!/[ぁ-んァ-ヶ一-龠々]/.test(explanation)) {
              errors.push(itemError(index, "日本語の解説がありません"));
            }
            const unnatural = `${item.detail || ""}\n${item.action_suggestion || ""}`;
            if (/^(?:まず[、,]\s*)?このニュースを(?:ひと|一)言で(?:いう|言う)と|^かんたんに言うと|すぐに全部のやり方を変える必要はありません|小さな作業から試すと安心です/.test(unnatural.trim())) {
              errors.push(itemError(index, "定型的で不自然な書き出し・結びがあります"));
            }
          });
          // 不備のある記事は個別に除外して残りを公開する。1件の不備で全体を止めない。
          if (fatal.length) {
            console.error(fatal.join("\n"));
            process.exit(1);
          }
          if (invalidIndexes.size) {
            console.error(`検証除外: ${invalidIndexes.size}件を公開から外します`);
            console.error(errors.slice(0, 40).join("\n"));
            const kept = items.filter((_, index) => !invalidIndexes.has(index));
            if (kept.length < 8) {
              console.error(`残り記事が8件未満(${kept.length}件)のため公開を中止します`);
              process.exit(1);
            }
            fs.writeFileSync("data.json", JSON.stringify(kept, null, 2) + "\n");
            console.log(`検証OK: ${kept.length}件を公開します (${invalidIndexes.size}件除外)`);
          } else {
            if (items.length < 8) {
              console.error(`記事数が不足しています: ${items.length}`);
              process.exit(1);
            }
            console.log(`検証OK: ${items.length}件すべてに要約・解説・分類があります`);
          }
          NODE

      - name: build public article pages and growth checks
        run: |
          node scripts/build-public-articles.mjs
          node scripts/test-growth-readiness.mjs
          node scripts/test-runtime-resilience.mjs
          node scripts/test-free-access-daily-metrics.mjs
          node scripts/test-dark-theme.mjs

      - name: persist validated public data
        run: |
          git config user.name "ai-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json index.html articles sitemap.xml robots.txt
          if git diff --staged --quiet; then
            echo "Published data is already current"
            exit 0
          fi
          git commit -m "update validated AI news"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Public data push failed (attempt ${attempt}); rebasing before retry"
            git pull --rebase --autostash origin main
          done
          echo "Validated public data could not be persisted"
          exit 1
