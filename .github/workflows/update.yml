name: Update AI feeds

on:
  schedule:
    # 海外発表の見逃しを減らすため、3時間ごとに監視する
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: get repo
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: test story deduplication
        run: node scripts/test-dedupe.mjs

      - name: test AI cache, protected slots, and reuse rules
        run: node scripts/test-ai-operations.mjs

      - name: validate optional USD budget settings
        env:
          AI_DAILY_BUDGET_USD: ${{ vars.AI_DAILY_BUDGET_USD }}
          AI_INPUT_USD_PER_MTOK: ${{ vars.AI_INPUT_USD_PER_MTOK }}
          AI_OUTPUT_USD_PER_MTOK: ${{ vars.AI_OUTPUT_USD_PER_MTOK }}
          AI_CACHE_WRITE_USD_PER_MTOK: ${{ vars.AI_CACHE_WRITE_USD_PER_MTOK }}
          AI_CACHE_READ_USD_PER_MTOK: ${{ vars.AI_CACHE_READ_USD_PER_MTOK }}
        run: |
          node - <<'NODE'
          const budget = Number(process.env.AI_DAILY_BUDGET_USD || 0);
          if (budget < 0 || !Number.isFinite(budget)) throw new Error("AI_DAILY_BUDGET_USD must be a non-negative number");
          if (budget > 0) {
            for (const key of ["AI_INPUT_USD_PER_MTOK", "AI_OUTPUT_USD_PER_MTOK", "AI_CACHE_WRITE_USD_PER_MTOK", "AI_CACHE_READ_USD_PER_MTOK"]) {
              const value = Number(process.env[key]);
              if (!(value > 0)) throw new Error(`${key} must be a positive number when the USD budget is enabled`);
            }
          }
          console.log(budget > 0 ? `USD budget enabled: $${budget}/day` : "USD budget disabled; hard article caps remain enabled");
          NODE

      - name: build data.json
        run: node update.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-5
          AI_DAILY_BUDGET_USD: ${{ vars.AI_DAILY_BUDGET_USD }}
          AI_INPUT_USD_PER_MTOK: ${{ vars.AI_INPUT_USD_PER_MTOK }}
          AI_OUTPUT_USD_PER_MTOK: ${{ vars.AI_OUTPUT_USD_PER_MTOK }}
          AI_CACHE_WRITE_USD_PER_MTOK: ${{ vars.AI_CACHE_WRITE_USD_PER_MTOK }}
          AI_CACHE_READ_USD_PER_MTOK: ${{ vars.AI_CACHE_READ_USD_PER_MTOK }}

      - name: persist charged AI operations ledger
        if: always()
        run: |
          files=()
          [ -f .ai-cache.json ] && files+=(.ai-cache.json)
          [ -f .ai-usage.json ] && files+=(.ai-usage.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No AI ledger files to persist"
            exit 0
          fi
          git config user.name "ai-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- "${files[@]}"
          if git diff --staged --quiet; then
            echo "AI ledger is already current"
            exit 0
          fi
          git commit -m "record AI processing usage"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Ledger push failed (attempt ${attempt}); rebasing before retry"
            git pull --rebase --autostash origin main
          done
          echo "AI ledger could not be persisted"
          exit 1

      - name: validate published articles
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const items = JSON.parse(fs.readFileSync("data.json", "utf8"));
          const required = [
            "title", "raw_excerpt", "detail", "change_summary",
            "impact_summary", "action_suggestion", "importance",
            "published_at", "source_url"
          ];
          const demoTitles = new Set([
            "Claude Code に新しいエージェント機能とサブエージェント並列実行が追加",
            "OpenAI が新モデルと API の価格改定を発表（pricing / new model）",
            "Suno に新しい音楽生成モデルとステム分離（music / voice）機能が登場",
            "v0 が画面デザインからフルスタックアプリ生成に対応（code / launch）",
            "Gemini に画像生成（image）と長文要約の新機能が追加",
            "Canva に AI 一括デザイン生成（Magic）機能が追加",
            "Runway が新しい動画生成モデル（video）をベータ公開",
            "Cursor のエディタUIと補完が小幅アップデート"
          ]);
          const normalize = value => String(value || "").normalize("NFKC")
            .toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "");
          const errors = [];
          if (!Array.isArray(items) || items.length < 8) {
            errors.push(`記事数が不足しています: ${Array.isArray(items) ? items.length : "not-array"}`);
          }
          if (Array.isArray(items) && items.length > 60) {
            errors.push(`公開上限60件を超えています: ${items.length}`);
          }
          (Array.isArray(items) ? items : []).forEach((item, index) => {
            for (const key of required) {
              if (typeof item[key] !== "string" || !item[key].trim()) {
                errors.push(`${index + 1}件目: ${key} が空です`);
              }
            }
            if (!Array.isArray(item.related_categories) || item.related_categories.length === 0) {
              errors.push(`${index + 1}件目: related_categories が空です`);
            }
            if (!["S", "A", "B", "C"].includes(String(item.importance || "").toUpperCase())) {
              errors.push(`${index + 1}件目: importance がS〜Cではありません`);
            }
            if (demoTitles.has(item.title)) {
              errors.push(`${index + 1}件目: デモ記事が混入しています`);
            }
            const normalizedTitle = normalize(item.title);
            const normalizedSummary = normalize(item.raw_excerpt);
            if (normalizedTitle && normalizedSummary &&
                (normalizedTitle === normalizedSummary ||
                 (normalizedSummary.includes(normalizedTitle) && normalizedSummary.length < normalizedTitle.length + 35))) {
              errors.push(`${index + 1}件目: 要約がタイトルの繰り返しです`);
            }
            const explanation = [
              item.raw_excerpt, item.detail, item.change_summary,
              item.impact_summary, item.action_suggestion
            ].join("");
            if (!/[ぁ-んァ-ヶ一-龠々]/.test(explanation)) {
              errors.push(`${index + 1}件目: 日本語の解説がありません`);
            }
          });
          if (errors.length) {
            console.error(errors.slice(0, 40).join("\n"));
            process.exit(1);
          }
          console.log(`検証OK: ${items.length}件すべてに要約・解説・分類があります`);
          NODE

      - name: persist validated public data
        run: |
          git config user.name "ai-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json index.html
          if git diff --staged --quiet; then
            echo "Published data is already current"
            exit 0
          fi
          git commit -m "update validated AI news"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Public data push failed (attempt ${attempt}); rebasing before retry"
            git pull --rebase --autostash origin main
          done
          echo "Validated public data could not be persisted"
          exit 1

      - name: prepare site
        run: |
          mkdir -p _site
          cp index.html data.json manifest.webmanifest sw.js _site/
          if [ -d assets ]; then cp -R assets _site/; fi

      - name: configure pages
        uses: actions/configure-pages@v5

      - name: upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
