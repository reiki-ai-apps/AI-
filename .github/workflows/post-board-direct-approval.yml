name: POST BOARD direct approval

on:
  repository_dispatch:
    types: [reiki_board_approval]

permissions:
  contents: write

concurrency:
  group: post-board-public-approval
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply revision-bound direct approval
        env:
          EVENT_PATH: ${{ github.event_path }}
          REQUEST_ID: ${{ github.event.client_payload.approval.request_id }}
        run: |
          node board/scripts/process-gateway-approval.mjs \
            --event "$EVENT_PATH" \
            --data-file board/data/board.json \
            --receipt "board/data/approval-receipts/gateway-${REQUEST_ID}.json"

      - name: Commit approval evidence
        env:
          REQUEST_ID: ${{ github.event.client_payload.approval.request_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- board/data/board.json "board/data/approval-receipts/gateway-${REQUEST_ID}.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record direct POST BOARD approval"
          git push origin HEAD:main
