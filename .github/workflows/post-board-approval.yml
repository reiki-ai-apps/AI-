name: POST BOARD public approval

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: post-board-public-approval
  cancel-in-progress: false

jobs:
  approve:
    if: contains(github.event.issue.body, 'REIKI_POST_BOARD_APPROVAL_V1')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply revision-bound approval
        env:
          EVENT_PATH: ${{ github.event_path }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          node board/scripts/process-public-approval-issue.mjs \
            --event "$EVENT_PATH" \
            --data-file board/data/board.json \
            --receipt "board/data/approval-receipts/issue-${ISSUE_NUMBER}.json"

      - name: Re-audit both approval components
        run: |
          node board/scripts/audit-component-approvals.mjs \
            --data-file board/data/board.json \
            --output board/data/component-approval-audit.json

      - name: Commit approval evidence
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- board/data/board.json board/data/component-approval-audit.json "board/data/approval-receipts/issue-${ISSUE_NUMBER}.json"
          git commit -m "Record POST BOARD approval #${ISSUE_NUMBER}"
          git push origin HEAD:main

      - name: Close approved request with receipt
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "承認証跡をPOST BOARDへ記録しました。Revisionと承認根拠Hashは board/data/approval-receipts/issue-${ISSUE_NUMBER}.json で確認できます。"
          gh issue close "$ISSUE_NUMBER" --reason completed
